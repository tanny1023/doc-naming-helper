<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公文截圖命名助手</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1c2330; --sub:#5d6778; --line:#dde1e8;
  --accent:#1f5fbf; --accent-ink:#fff; --ok:#12703a; --warn:#b45309; --out-bg:#eef4ff;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12161d; --card:#1b212b; --ink:#e7ebf2; --sub:#9aa5b8; --line:#2c3543;
    --accent:#5b9bff; --accent-ink:#0b1220; --ok:#5fd28f; --warn:#f0a94a; --out-bg:#18263d;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 "Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#drop{border:2px dashed var(--line);border-radius:12px;min-height:260px;display:flex;
  align-items:center;justify-content:center;text-align:center;padding:12px;cursor:pointer;
  color:var(--sub);position:relative;overflow:hidden;outline:none}
#drop:focus,#drop.over{border-color:var(--accent);background:var(--out-bg)}
#drop img{max-width:100%;max-height:420px;display:block;margin:0 auto;border-radius:6px}
#drop b{color:var(--ink);font-size:18px;display:block;margin-bottom:6px}
.status{margin-top:10px;font-size:14px;color:var(--sub);min-height:22px}
.status.err{color:#c0392b}.status.ok{color:var(--ok)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 3px}
input[type=text],input[type=number],input[type=password],textarea,select{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2.r3{grid-template-columns:1fr 1fr 90px}
@media(max-width:520px){.row2,.row2.r3{grid-template-columns:1fr}}
.out{margin-top:16px;background:var(--out-bg);border:1px solid var(--accent);border-radius:12px;padding:14px}
.out .name{font-size:18px;font-weight:600;word-break:break-all;user-select:all;min-height:28px}
.out .len{font-size:12px;color:var(--sub);margin-top:4px}
button.primary{margin-top:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;
  padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);margin:10px 0 0}
details{margin-top:16px}
summary{cursor:pointer;color:var(--sub);font-size:14px}
.day{margin-top:14px}
.day:first-child{margin-top:8px}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.day-head b{color:var(--ink);font-size:14px}
.hist{list-style:none;margin:6px 0 0;padding:0}
.hist li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.hist li span{flex:1;word-break:break-all}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>公文截圖命名助手</h1>
  <p class="lead">把公文截圖貼上（Ctrl+V），自動用內建 OCR 辨識欄位並產出檔案名稱。辨識結果可直接修改，檔名會即時更新；覺得辨識不準可按「重新辨識」再跑一次。</p>

  <div class="grid">
    <!-- 左：截圖 -->
    <div class="card">
      <div class="seg" role="group" aria-label="截圖格式">
        <button id="m1" aria-pressed="false">方法一：PDF 格式</button>
        <button id="m2" aria-pressed="true">方法二：公文系統</button>
      </div>
      <div id="drop" tabindex="0" title="點一下後按 Ctrl+V，或拖曳圖片進來">
        <div id="dropHint"><b>在此貼上截圖（Ctrl+V）</b>也可以拖曳圖片，或點一下選擇檔案</div>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="status" id="status"></div>
      <div class="bar" id="bar"><i></i></div>
      <button type="button" id="rerun" class="ghost" style="display:none;margin-top:8px">重新辨識這張截圖</button>

      <details>
        <summary>設定（去贅詞清單）</summary>
        <p class="hint" style="margin-top:0">辨識方式固定使用內建 OCR：完全免費、在你的瀏覽器裡執行，截圖不會上傳到任何伺服器。</p>
        <label for="noise">要從主旨移除的贅詞（一行一個）</label>
        <textarea id="noise"></textarea>
        <div class="chk"><input type="checkbox" id="autocopy" checked><label for="autocopy" style="margin:0;color:var(--ink)">辨識完成後自動複製檔名</label></div>
      </details>
    </div>

    <!-- 右：欄位與結果 -->
    <div class="card">
      <div class="row2">
        <div><label for="fSend" id="lSend">來文日期</label><input type="text" id="fSend" placeholder="115/04/02"></div>
        <div><label for="fRecv">收文日期</label><input type="text" id="fRecv" placeholder="115/04/07"></div>
      </div>
      <div class="row2 r3">
        <div><label for="fRef">來文字號</label><input type="text" id="fRef" placeholder="麗字第1150400048號"></div>
        <div><label for="fDoc">公文文號</label><input type="text" id="fDoc" placeholder="P11150011116"></div>
        <div><label for="fAtt">附件件數</label><input type="number" id="fAtt" min="0" value="0"></div>
      </div>
      <label for="fSubj">主旨（原文）</label>
      <textarea id="fSubj" placeholder="檢送「臺中市巨蛋體育館興建工程」B3F層鋼筋工程施工圖…資料，惠請核復。"></textarea>
      <div class="chk"><input type="checkbox" id="omitSame"><label for="omitSame" style="margin:0;color:var(--ink)">來文日期與收文日期相同時，省略「收訖」</label></div>

      <div class="out">
        <div class="hint" style="margin:0 0 4px">檔案名稱</div>
        <div class="name" id="result">（尚無內容）</div>
        <div class="len" id="len"></div>
        <button class="primary" id="copy">複製檔名</button>
      </div>

      <details open>
        <summary>工作日誌（按「複製檔名」才會記錄；下班時可一鍵複製整天）</summary>
        <div id="hist"></div>
      </details>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_NOISE = ['請查照','詳如說明','敬請查核','敬請查照','敬請核備','惠請核復','敬請核復','敬請核定','惠請核定'];
let mode = 2;
let currentBlob = null;

/* ---------- 設定存取 ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ---------- 日期 ---------- */
const pad = (n,w=2)=>String(n).padStart(w,'0');
function parseDate(s){
  s = (s||'').trim();
  let m = s.match(/(?:民國)?\s*(\d{2,3})\s*[\/.\-年]\s*(\d{1,2})\s*[\/.\-月]\s*(\d{1,2})/);
  if(!m) m = s.match(/^(\d{3})(\d{2})(\d{2})$/);
  if(!m) return null;
  return {y:+m[1], m:+m[2], d:+m[3]};
}
const full = d => pad(d.y,3)+pad(d.m)+pad(d.d);
const mmdd = d => pad(d.m)+pad(d.d);

/* ---------- 主旨優化 ---------- */
function cleanSubject(raw){
  let s = (raw||'').replace(/[\r\n]+/g,'');
  s = s.replace(/\s+(?=[㐀-鿿（(「])|(?<=[㐀-鿿）)」，。])\s+/g,'');   // 中文間多餘空白
  // 工程案名（含後面括號內的地址），連同引號一起移除
  s = s.replace(/[「『"“'‘]?(?:(?:臺|台)中市)?巨蛋(?:體育館|體育場)?(?:興建)?工程(?:[（(][^）)]*[）)])?[」』"”'’]?/g,'');
  // 協力廠商說明
  s = s.replace(/共同承攬商.*?提送之/g,'');
  s = s.replace(/(?:股份)?有限公司/g,'');
  // 贅詞
  const noise = $('noise').value.split('\n').map(x=>x.trim()).filter(Boolean)
    .sort((a,b)=>b.length-a.length);
  for(const w of noise){ s = s.split(w).join(''); }
  s = s.replace(/[，,]\S{0,3}請(?:核定|核復|核備|核示|查核|查照)。?$/,'');   // 句尾收尾套語（容忍 OCR 錯字，如「,人稅請核定」）
  s = s.replace(/[「」『』]/g,'');
  s = s.replace(/[\\\/:*?"<>|]/g,'');                       // 檔名不允許的字元
  s = s.replace(/[，,、;；]{2,}/g,'，').replace(/^[，,、;；。.\s]+|[，,、;；。.\s]+$/g,'');
  return s;
}

/* ---------- 組檔名 ---------- */
function buildName(){
  const send = parseDate($('fSend').value), recv = parseDate($('fRecv').value);
  const ref = $('fRef').value.trim().replace(/\s+/g,''), doc = $('fDoc').value.trim().replace(/\s+/g,'');
  const att = parseInt($('fAtt').value,10)||0;
  let subj = cleanSubject($('fSubj').value);

  const main = send || recv;
  let date = main ? full(main) : '';
  if(main && recv && (main!==recv) && !(main.y===recv.y&&main.m===recv.m&&main.d===recv.d && $('omitSame').checked)){
    date += `(${mmdd(recv)}收訖)`;
  }

  if(mode===1){
    subj += att>0 ? '(有附件)' : '(無附件)';
  }else if(att>0 && !subj.includes('(附件)') && !subj.includes('（附件）')){
    subj += '(附件)';
  }
  const name = [date, ref, doc, subj].filter(Boolean).join('-')
    .replace(/[\\\/:*?"<>|]/g,'');
  return name;
}

function render(){
  const n = buildName();
  $('result').textContent = n || '（尚無內容）';
  $('len').textContent = n ? `${n.length} 字` : '';
}

/* ---------- 欄位擷取（OCR 文字） ---------- */
function findRef(flat, isSystem){
  const fmt = m => `${m[1]}字第${m[2]}號`;
  // 1) 「來文字號／發文字號」標籤後面
  let m = flat.match(/(?:來文|發文)?字號[:：;]?([一-鿿]{1,8}?)字第*(\d{6,})號?/);
  if(m) return fmt(m);
  // 2) 全文找「XX字第NNN號」；PDF 只看「主旨」之前，避免抓到說明文字裡引用的其他公文
  const head = isSystem ? flat : flat.split('主旨')[0];
  const all = [...head.matchAll(/([一-鿿]{1,8}?)字第*(\d{6,})號?/g)];
  if(all.length) return fmt(all[0]);
  // 3) 標籤後直接是數字（機關字被 OCR 吃掉）
  m = flat.match(/(?:來文|發文)?字號[:：;]?[^\d]{0,10}(\d{9,})/);
  return m ? m[1] : '';
}
function extractFromText(text){
  const t = text.replace(/[ \t　]+/g,'');
  const out = {};
  const isSystem = /收文資訊|公文文號|附件件數|來文機關/.test(t);
  out.mode = isSystem ? 2 : 1;
  const mDoc = t.match(/P\d{9,12}/i); if(mDoc) out.doc = mDoc[0].toUpperCase();
  const ref = findRef(text.replace(/\s+/g,''), isSystem);   // 換行、空白、「第」重複都容忍
  if(ref) out.ref = ref;
  if(isSystem){
    let m = t.match(/來文日期[:：]?(\d{2,3}[\/.]\d{1,2}[\/.]\d{1,2})/); if(m) out.send = m[1];
    m = t.match(/收文日期[:：]?(\d{2,3}[\/.]\d{1,2}[\/.]\d{1,2})/); if(m) out.recv = m[1];
    m = t.match(/附件件數[:：]?(\d+)/); if(m) out.att = +m[1];
    m = t.match(/主旨[:：]?([\s\S]+?)(?:來文機關|主辦單位|主辦人員|限辦日期|簽核|決行|補正|$)/); if(m) out.subj = m[1];
  }else{
    let m = t.match(/發文日期[:：]?中華民國(\d{2,3})年(\d{1,2})月(\d{1,2})日/); if(m) out.send = `${m[1]}/${m[2]}/${m[3]}`;
    m = t.match(/收文[:：]?(\d{2,3}[\/.]\d{1,2}[\/.]\d{1,2})/); if(m) out.recv = m[1];
    m = t.match(/主旨[:：]?([\s\S]+?)(?:說明[:：]|正本[:：]|副本[:：]|$)/); if(m) out.subj = m[1];
    m = t.match(/附件[:：]([^\n]+)/);
    if(m) out.att = /無/.test(m[1]) ? 0 : 1;
  }
  return out;
}

/* ---------- 辨識：內建 OCR ---------- */
function loadScript(src){
  return new Promise((res,rej)=>{
    if(window.Tesseract) return res();
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('無法載入 OCR 元件，請確認網路連線'));
    document.head.appendChild(s);
  });
}
async function toCanvas(blob){                   // 小圖放大後 OCR 較準
  const bmp = await createImageBitmap(blob);
  const k = bmp.width>=1400 ? 1 : Math.min(3, 1400/bmp.width), c = document.createElement('canvas');
  c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  const g = c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(bmp,0,0,c.width,c.height);
  return c;
}
function cropCanvas(src,x,y,w,h,k){
  x=Math.max(0,Math.round(x)); y=Math.max(0,Math.round(y));
  w=Math.min(src.width-x,Math.round(w)); h=Math.min(src.height-y,Math.round(h));
  const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  const g=c.getContext('2d'); g.imageSmoothingQuality='high'; g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(src,x,y,w,h,0,0,c.width,c.height); return c;
}
// 在 OCR 的字詞位置中找出標籤（例如「來文字號」），回傳其外框
function findLabel(words,label){
  const chars=[]; words.forEach(w=>[...(w.text||'')].forEach(ch=>{ if(!/\s/.test(ch)) chars.push({ch,w}); }));
  const seq=[...label];
  for(let i=0;i<=chars.length-seq.length;i++){
    if(seq.every((c,j)=>chars[i+j].ch===c)){
      const ws=chars.slice(i,i+seq.length).map(o=>o.w.bbox);
      return {x1:Math.max(...ws.map(b=>b.x1)), y0:Math.min(...ws.map(b=>b.y0)), y1:Math.max(...ws.map(b=>b.y1))};
    }
  }
  return null;
}
async function runOCR(blob){
  setStatus('載入 OCR 元件…（首次需下載中文語言包，約 10–20 秒）');
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const worker = await Tesseract.createWorker('chi_tra',1,{logger:m=>{
    if(m.progress!=null){ setProgress(m.progress); setStatus(`OCR 辨識中… ${m.status} ${Math.round(m.progress*100)}%`); }
  }});
  try{
    const cv = await toCanvas(blob);
    const r = await worker.recognize(cv);
    const out = extractFromText(r.data.text);
    // 公文系統畫面：整頁 OCR 常漏掉小格子，改為裁出「來文字號」右邊那格放大重跑
    if(out.mode===2 && !/字第\d{6,}號/.test(out.ref||'')){
      const L = findLabel(r.data.words||[],'來文字號');
      if(L){
        setStatus('補強辨識「來文字號」…');
        const h = L.y1-L.y0;
        const crop = cropCanvas(cv, L.x1+6, L.y0-h*0.75, cv.width-L.x1-10, h*2.5, 3);
        await worker.setParameters({tessedit_pageseg_mode:'6'});
        const r2 = await worker.recognize(crop);
        const ref = findRef(r2.data.text.replace(/\s+/g,''), true);
        if(ref) out.ref = ref;
      }
    }
    // 主旨：同樣裁出主旨那格放大重跑（整頁 OCR 容易混入雜字）
    if(out.mode===2){
      const flat = t => t.replace(/\s+/g,'');
      const lines = r.data.lines||[];
      const i0 = lines.findIndex(l=>/主旨/.test(flat(l.text)));
      const L = findLabel(r.data.words||[],'主旨');
      if(i0>=0 && L){
        let i1 = lines.findIndex((l,i)=>i>i0 && /主辦單位|主辦人員|限辦日期/.test(flat(l.text)));
        if(i1<0) i1 = Math.min(lines.length,i0+3);
        const sel = lines.slice(i0,i1).map(l=>l.bbox);
        const y0 = Math.min(...sel.map(b=>b.y0))-6, y1 = Math.max(...sel.map(b=>b.y1))+6;
        setStatus('補強辨識「主旨」…');
        const crop = cropCanvas(cv, L.x1+6, y0, cv.width-L.x1-12, y1-y0, 2.5);
        await worker.setParameters({tessedit_pageseg_mode:'6'});
        const r3 = await worker.recognize(crop);
        const subj = flat(r3.data.text);
        if(subj.length>=6) out.subj = subj;
      }
    }
    return out;
  }finally{ await worker.terminate(); }
}

/* ---------- 流程 ---------- */
function setStatus(t,cls=''){ const s=$('status'); s.textContent=t; s.className='status '+cls; }
function setProgress(p){ const b=$('bar'); b.style.display=p==null?'none':'block'; if(p!=null) b.firstElementChild.style.width=(p*100)+'%'; }

function setMode(m){
  mode = m;
  $('m1').setAttribute('aria-pressed', m===1);
  $('m2').setAttribute('aria-pressed', m===2);
  $('lSend').textContent = m===1 ? '發文日期（公文內）' : '來文日期';
  $('omitSame').checked = (m===2);
  render();
}

function fill(o){
  if(o.mode) setMode(o.mode);
  $('fSend').value = o.send||'';
  $('fRecv').value = o.recv||'';
  $('fRef').value  = o.ref||'';
  $('fDoc').value  = o.doc||'';
  $('fAtt').value  = o.att||0;
  $('fSubj').value = (o.subj||'').replace(/\s*\n\s*/g,'');
  render();
}

function showImage(blob){
  currentBlob = blob;
  const url = URL.createObjectURL(blob);
  $('drop').innerHTML = `<img alt="已貼上的截圖" src="${url}">`;
  $('rerun').style.display = 'inline-block';
}

async function recognize(){
  if(!currentBlob) return;
  try{
    setProgress(0);
    const o = await runOCR(currentBlob);
    fill(o);
    setProgress(null);
    const name = buildName();
    if(name){
      let doneMsg='';
      if($('autocopy').checked){
        const copied = await copyAndLog(name);
        doneMsg = copied ? '，已複製檔名並記錄到工作日誌' : '，已記錄到工作日誌（複製失敗，請手動選取）';
      }
      const miss = [['fSend','日期'],['fRef','來文字號'],['fDoc','公文文號'],['fSubj','主旨']]
        .filter(([id])=>!$(id).value.trim()).map(x=>x[1]);
      if(miss.length) setStatus(`未辨識到：${miss.join('、')}，請手動補上再按「複製檔名」。`,'err');
      else setStatus(`辨識完成${doneMsg}。請逐字核對欄位後再使用。`,'ok');
    }else setStatus('沒有辨識到內容，請換一張截圖或手動輸入','err');
  }catch(e){
    setProgress(null);
    setStatus(e.message||String(e),'err');
  }
}

async function handleImage(blob){
  if(!blob) return;
  showImage(blob);
  await recognize();
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{
      const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
      const ok=document.execCommand('copy'); ta.remove(); return ok;
    }catch(e2){ return false; }
  }
}
async function copyAndLog(name){                 // 複製檔名代表「這份做完了」，一律記錄；剪貼簿失敗只影響提示文字
  if(name) addHistory(name);
  return await copyText(name);
}

/* ---------- 工作日誌 ---------- */
function todayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function dateLabel(key){
  const [y,m,d]=key.split('-').map(Number);
  const w=['日','一','二','三','四','五','六'][new Date(y,m-1,d).getDay()];
  return `${m}/${d}（週${w}）`;
}

let history = [];
try{
  const raw = JSON.parse(store.get('gw_hist','[]'));
  history = raw.map(x => typeof x==='string' ? {name:x, date:todayKey(), ts:0} : x);   // 相容舊版（無日期）紀錄
}catch(e){ history = []; }

function addHistory(n){
  if(!n) return;
  const date = todayKey();
  history = history.filter(x=>!(x.name===n && x.date===date));
  history.unshift({name:n, date, ts:Date.now()});
  history = history.slice(0,300);
  store.set('gw_hist', JSON.stringify(history));
  renderHistory();
}

function renderHistory(){
  const box=$('hist'); box.innerHTML='';
  if(!history.length){ box.innerHTML='<p class="hint" style="margin:8px 0 0">（還沒有紀錄：按「複製檔名」後會自動記在這裡）</p>'; return; }
  const today = todayKey();
  const groups = [];
  for(const h of history){
    let g = groups.find(g=>g.date===h.date);
    if(!g){ g={date:h.date, items:[]}; groups.push(g); }
    g.items.push(h);
  }
  groups.forEach(g=>{
    const day=document.createElement('div'); day.className='day';
    const head=document.createElement('div'); head.className='day-head';
    const label=document.createElement('b');
    label.textContent = (g.date===today ? '今天 ' : '') + dateLabel(g.date) + `（${g.items.length} 筆）`;
    const copyAllBtn=document.createElement('button'); copyAllBtn.className='ghost'; copyAllBtn.textContent='複製整天檔名';
    copyAllBtn.onclick=async()=>{
      const text = g.items.map(it=>it.name).reverse().join('\n');   // 由早到晚排序，方便回報
      const ok = await copyText(text);
      copyAllBtn.textContent = ok ? `已複製 ${g.items.length} 筆` : '複製失敗';
      setTimeout(()=>copyAllBtn.textContent='複製整天檔名',1500);
    };
    head.append(label, copyAllBtn);
    const ul=document.createElement('ul'); ul.className='hist';
    g.items.forEach(it=>{
      const li=document.createElement('li'), sp=document.createElement('span'), b=document.createElement('button');
      sp.textContent=it.name; b.className='ghost'; b.textContent='複製';
      b.onclick=async()=>{ const ok=await copyText(it.name); b.textContent=ok?'已複製':'失敗'; setTimeout(()=>b.textContent='複製',1200); };
      li.append(sp,b); ul.appendChild(li);
    });
    day.append(head, ul);
    box.appendChild(day);
  });
}

/* ---------- 事件 ---------- */
document.addEventListener('paste',e=>{
  const items=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/'));
  if(!items.length) return;
  e.preventDefault();
  handleImage(items[items.length-1].getAsFile());     // 只處理最後一張
});
const drop=$('drop');
drop.addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{ handleImage(e.target.files[0]); e.target.value=''; });
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{ const f=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).pop(); handleImage(f); });
$('rerun').addEventListener('click',()=>recognize());

['fSend','fRecv','fRef','fDoc','fAtt','fSubj','omitSame'].forEach(id=>$(id).addEventListener('input',render));
$('noise').addEventListener('input',()=>{ store.set('gw_noise',$('noise').value); render(); });
$('autocopy').addEventListener('change',()=>store.set('gw_autocopy',$('autocopy').checked?'1':'0'));
$('m1').onclick=()=>setMode(1);
$('m2').onclick=()=>setMode(2);
$('copy').onclick=async()=>{
  const ok = await copyAndLog(buildName());
  $('copy').textContent=ok?'已複製 ✓':'複製失敗，請手動選取'; setTimeout(()=>$('copy').textContent='複製檔名',1400);
};

/* ---------- 初始化 ---------- */
$('noise').value = store.get('gw_noise', DEFAULT_NOISE.join('\n'));
$('autocopy').checked = store.get('gw_autocopy','1')==='1';
setMode(2);
renderHistory();
</script>
